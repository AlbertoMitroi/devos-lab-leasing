  - id: leasing-child-flows
    area: workflow
    question: How are child flows spawned, and which spawn chain exists?
    expected: After appending, every new FlowFactRaised fact and FlowStatusChanged status is used as a trigger; processes whose StartedBy contains it start as child flows with the parent id. Chain - Application (status ApplicationApproved) -> Assessment (RiskAssessed) -> Quote (QuoteAccepted) -> Lease. The fact ApplicationWithdrawn raised by WithdrawActionHandler starts nothing (no process lists it).
    evidence:
      - src/Leasing.AppServices/Flows/FlowEngine.cs:133
      - src/Leasing.AppServices/Flows/FlowEngine.cs:137
      - src/Leasing.AppServices/Flows/ProcessCatalog.cs:28
