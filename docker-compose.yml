# Docker environment of the lab: infrastructure, the sibling services built from ../lab-pricing and ../lab-intake, and the leasing host.
# Secrets come from the environment: POSTGRES_PASSWORD, RABBITMQ_PASSWORD, LOCALDEV_SIGNING_KEY, NUGET_TOKEN (read:packages).
name: lab

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      CLUSTER_ID: lab-kafka-cluster-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8081:8081"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  pricing-api:
    build:
      context: ../lab-pricing
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["5081:8080"]

  intake-worker:
    build:
      context: ../lab-intake
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on: [kafka, schema-registry]
    ports: ["5082:8080"]

  leasing-host:
    build:
      context: .
      target: runtime
      secrets: [nuget_token]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      PGPASSWORD: ${POSTGRES_PASSWORD}
      Messaging__RabbitMqHost__Password: ${RABBITMQ_PASSWORD}
      Authentication__LocalDev__SigningKey: ${LOCALDEV_SIGNING_KEY:?set LOCALDEV_SIGNING_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka: { condition: service_started }
      elasticsearch: { condition: service_started }
      pricing-api: { condition: service_started }
    ports: ["5080:8080"]

secrets:
  nuget_token:
    environment: NUGET_TOKEN
